services:
  rag-service:
    image: doc-assistant-service:v1
    container_name: doc-assistant-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - hf_cache:/app/cache/huggingface
    extra_hosts:
      # универсально: и Linux, и Docker Desktop (IP-адрес вместо host-gateway работать не будет)
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  hf_cache:
